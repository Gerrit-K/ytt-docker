name: docker-build-and-push
run-name: Build images and push to Docker Hub

on:
  push:
    branches:
      - "**"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream ytt release to (re)build and publish, e.g. v0.56.0"
        required: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          MODE: >-
            ${{ github.event_name == 'schedule' && 'new'
            || github.event_name == 'workflow_dispatch' && format('version:{0}', inputs.version)
            || github.ref_name == github.event.repository.default_branch && 'push-latest'
            || 'latest' }}
        run: echo "matrix=$(.github/scripts/plan.sh)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: gerritk/ytt:test
          build-args: |
            YTT_VERSION=${{ matrix.version }}
            GO_VERSION=${{ matrix.go }}
          cache-from: type=gha,scope=${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}
      - name: Smoke test
        run: |
          docker run --rm gerritk/ytt:test --version
          docker run --rm gerritk/ytt:test -h
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: E2E tests
        run: ./test-e2e.sh gerritk/ytt:test "${{ matrix.version }}"
      - name: Set up QEMU
        if: matrix.push
        uses: docker/setup-qemu-action@v4
      - name: Login to Docker Hub
        if: matrix.push
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        if: matrix.push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ matrix.tags }}
          build-args: |
            YTT_VERSION=${{ matrix.version }}
            GO_VERSION=${{ matrix.go }}
          cache-from: type=gha,scope=${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.version }}
