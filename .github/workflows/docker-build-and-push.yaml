name: docker-build-and-push
run-name: Build images and push to Docker Hub

on:
  push:
    branches:
      - "*"
    tags:
      - "v*.*.*"

env:
  YTT_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'develop' }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: gerritk/ytt
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build test image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: gerritk/ytt:test
          build-args: YTT_VERSION=${{ env.YTT_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm gerritk/ytt:test --version
          docker run --rm gerritk/ytt:test -h
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: E2E tests
        run: ./test-e2e.sh gerritk/ytt:test "$YTT_VERSION"
      - name: Set up QEMU
        if: github.ref_type == 'tag'
        uses: docker/setup-qemu-action@v2
      - name: Login to Docker Hub
        if: github.ref_type == 'tag'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: YTT_VERSION=${{ env.YTT_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
